---
# ConfigMap: shared service URLs
apiVersion: v1
kind: ConfigMap
metadata:
  name: resilienceos-config
  namespace: resilienceos
data:
  USER_SERVICE_URL: "http://user-service:8001"
  PRODUCT_SERVICE_URL: "http://product-service:8002"
  ORDER_SERVICE_URL: "http://order-service:8003"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8004"
  API_GATEWAY_URL: "http://api-gateway:8000"
  CHAOS_AGENT_URL: "http://chaos-agent:8010"
  DATABASE_URL: "postgresql://resilience:resilience@postgres:5432/resilienceos"
  REDIS_URL: "redis://redis:6379/0"

---
# Secret: sensitive values
apiVersion: v1
kind: Secret
metadata:
  name: resilienceos-secrets
  namespace: resilienceos
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "your-api-key-here"
  POSTGRES_PASSWORD: "resilience"

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: resilienceos

---
# PostgreSQL PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: resilienceos
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi

---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: resilienceos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports: [{containerPort: 5432}]
          env:
            - name: POSTGRES_USER
              value: resilience
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resilienceos-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: resilienceos
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "resilience", "-d", "resilienceos"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: resilienceos
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: resilienceos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: resilienceos
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
# User Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: resilienceos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: resilienceos/user-service:latest
          command: ["uvicorn", "services.user_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports: [{containerPort: 8001}]
          envFrom:
            - configMapRef:
                name: resilienceos-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: resilienceos
spec:
  selector:
    app: user-service
  ports:
    - port: 8001
      targetPort: 8001

---
# Product Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: resilienceos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: resilienceos/product-service:latest
          command: ["uvicorn", "services.product_service.main:app", "--host", "0.0.0.0", "--port", "8002"]
          ports: [{containerPort: 8002}]
          envFrom:
            - configMapRef:
                name: resilienceos-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: resilienceos
spec:
  selector:
    app: product-service
  ports:
    - port: 8002
      targetPort: 8002

---
# Order Service Deployment + HPA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: resilienceos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: resilienceos/order-service:latest
          command: ["uvicorn", "services.order_service.main:app", "--host", "0.0.0.0", "--port", "8003"]
          ports: [{containerPort: 8003}]
          envFrom:
            - configMapRef:
                name: resilienceos-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: resilienceos
spec:
  selector:
    app: order-service
  ports:
    - port: 8003
      targetPort: 8003

---
# HPA for Order Service (demonstrates auto-scaling)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service-hpa
  namespace: resilienceos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# Notification Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: resilienceos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: resilienceos/notification-service:latest
          command: ["uvicorn", "services.notification_service.main:app", "--host", "0.0.0.0", "--port", "8004"]
          ports: [{containerPort: 8004}]
          envFrom:
            - configMapRef:
                name: resilienceos-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: resilienceos
spec:
  selector:
    app: notification-service
  ports:
    - port: 8004
      targetPort: 8004

---
# API Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: resilienceos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: resilienceos/api-gateway:latest
          command: ["uvicorn", "services.api_gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef:
                name: resilienceos-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: resilienceos
spec:
  selector:
    app: api-gateway
  type: LoadBalancer
  ports:
    - port: 8000
      targetPort: 8000

---
# Chaos Agent
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-agent
  namespace: resilienceos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-agent
  template:
    metadata:
      labels:
        app: chaos-agent
    spec:
      containers:
        - name: chaos-agent
          image: resilienceos/chaos-agent:latest
          command: ["uvicorn", "chaos_agent.main:app", "--host", "0.0.0.0", "--port", "8010"]
          ports: [{containerPort: 8010}]
          envFrom:
            - configMapRef:
                name: resilienceos-config

---
apiVersion: v1
kind: Service
metadata:
  name: chaos-agent
  namespace: resilienceos
spec:
  selector:
    app: chaos-agent
  ports:
    - port: 8010
      targetPort: 8010

---
# NetworkPolicy: demonstrate real K8s network partition capability
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-service-ingress
  namespace: resilienceos
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: chaos-agent
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: user-service
        - podSelector:
            matchLabels:
              app: product-service
        - podSelector:
            matchLabels:
              app: postgres
        - podSelector:
            matchLabels:
              app: redis
